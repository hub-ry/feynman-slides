<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feynman-slides</title>
<script>
  // Applied before first paint so the correct theme is never repainted over.
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Row one: what deck you are in, and the one button that leaves it. -->
<div class="titlebar">
  <span class="logo" aria-hidden="true"></span>
  <select id="picker" aria-label="deck"></select>
  <button id="new" class="ghost">New</button>

  <span class="spacer"></span>

  <span id="status" class="status"></span>
  <span id="gate" class="gate" hidden></span>
  <button id="theme" class="icon" title="Theme" aria-label="Theme"></button>
  <button id="export" class="primary" disabled>Export</button>
</div>

<!-- Row two: what you can do to the slide in front of you. -->
<div class="toolbar">
  <button id="addSlide" class="icon" title="New slide">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M12 9.5v5M9.5 12h5"/></svg>
  </button>
  <span class="sep"></span>

  <button id="addText" class="icon" title="Text box (T)">
    <svg viewBox="0 0 24 24"><path d="M5 7V5.5h14V7M12 5.5v13M9.5 18.5h5"/></svg>
  </button>
  <button id="addImage" class="icon" title="Image (or just paste one)">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M3.5 15l4.5-4 4 3.5 3.5-3 5 4.5"/><circle cx="9" cy="9.5" r="1.3"/></svg>
  </button>

  <span class="sep"></span>
  <div id="textTools" class="tools" hidden>
    <button id="asTitle" class="role title" title="Title">Title</button>
    <button id="asBody" class="role body" title="Normal">Normal</button>
  </div>
  <button id="del" class="icon danger" title="Delete (backspace)" hidden>
    <svg viewBox="0 0 24 24"><path d="M5.5 7.5h13M9.5 7.5V5.5h5v2M7 7.5l.8 11.5h8.4L17 7.5M10.5 11v5M13.5 11v5"/></svg>
  </button>
</div>

<main>
  <nav id="rail" aria-label="slides"></nav>

  <section class="stage-wrap">
    <div id="stage">
      <div id="canvas"></div>
      <div id="guides"></div>
    </div>

    <!-- The bin is deck-wide on purpose: source material does not divide by slide. -->
    <div class="bin">
      <div class="bin-head">
        <button id="binToggle" class="ghost" aria-expanded="false">
          <span class="caret">&rsaquo;</span> Source material <span id="binCount" class="count"></span>
        </button>
        <span class="hint">checked against every slide, shown on none of them</span>
      </div>
      <div id="binBody" hidden>
        <div id="binDrop" class="drop">
          <button id="binUpload" class="ghost upload">
            <svg viewBox="0 0 24 24"><path d="M12 15.5V5.5M8.5 9L12 5.5 15.5 9M5 15.5v3h14v-3"/></svg>
            Upload lecture slides
          </button>
          <span class="hint">PDF or images - drop them anywhere here. Each PDF page becomes one source.</span>
        </div>
        <div id="binList"></div>
        <textarea id="binAdd" spellcheck="false" rows="2"
          placeholder="Or paste a passage, a definition, a slide. Enter to add, shift+enter for a new line."></textarea>
      </div>
    </div>
  </section>

  <aside class="critique">
    <div class="critique-head">Critic</div>
    <div id="findings"></div>
  </aside>
</main>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="sourceFile" accept="application/pdf,image/*" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
