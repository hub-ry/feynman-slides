<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feynman-slides</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="mark">feynman-slides</span>
  <select id="picker" aria-label="deck"></select>
  <button id="new" class="ghost">new deck</button>
  <span class="sep"></span>

  <button id="addText" title="Add a text box (T)">text</button>
  <button id="addImage" title="Add an image (or just paste one)">image</button>

  <span class="sep"></span>
  <div id="textTools" class="tools" hidden>
    <button id="asTitle" class="role title" title="Title">Title</button>
    <button id="asBody" class="role body" title="Normal">Normal</button>
  </div>
  <button id="del" class="danger" title="Delete (backspace)" hidden>delete</button>

  <span class="spacer"></span>
  <span id="status" class="status"></span>
  <span id="gate" class="gate" hidden></span>
  <button id="export" disabled>export deck</button>
</header>

<main>
  <nav id="rail" aria-label="slides"></nav>

  <section class="stage-wrap">
    <div id="stage">
      <div id="canvas"></div>
      <div id="guides"></div>
    </div>
    <div class="bin">
      <div class="bin-head">
        <button id="binToggle" class="ghost" aria-expanded="false">
          <span class="caret">&rsaquo;</span> source material <span id="binCount" class="count"></span>
        </button>
        <span class="hint">for the whole deck. the critic checks every slide against all of it, and none of it is shown on a slide.</span>
      </div>
      <div id="binBody" hidden>
        <div id="binList"></div>
        <textarea id="binAdd" spellcheck="false" rows="2"
          placeholder="Paste a lecture slide, a passage, a definition. Enter to add, shift+enter for a new line."></textarea>
      </div>
    </div>
  </section>

  <aside class="critique"><div id="findings"></div></aside>
</main>

<input type="file" id="file" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
